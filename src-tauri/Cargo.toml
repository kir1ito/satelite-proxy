[package]
name = "satelite-proxy"
version = "1.0.4"
description = "Satelite — lightweight sing-box desktop client"
authors = ["you"]
edition = "2021"

[lib]
name = "satelite_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
url = "2"
urlencoding = "2"
idna = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
# reqwest 同时编入两套 TLS 后端：默认仍是 native-tls(与上游一致)；SChannel 的 ClientHello 指纹会被
# 部分 Cloudflare WAF 拦截(订阅拉取 403)，所以另编入 rustls，订阅页可按 settings.subscription_tls_backend
# 切换(见 services/import.rs)。内核下载等其余请求固定走 native。显式开 native-tls 只是让代码能调用
# use_native_tls() 明确选定后端(它与默认特性 default-tls 等价，默认集里没有这个特性名)。
reqwest = { version = "0.12", default-features = true, features = ["json", "stream", "native-tls", "rustls-tls"] }
# Clash API must not use reqwest::blocking — nested Tokio runtime panics inside
# tauri async workers ("Cannot drop a runtime in a context where blocking is not allowed").
ureq = { version = "2.12", default-features = true, features = ["json"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
flate2 = "1"
if-addrs = "0.15.0"
tar = "0.4"
zip = "2"
tauri-plugin-deep-link = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Same windows crate tauri already depends on (version-unified, no extra copy);
# adds the NT process-table query used by core::memory's RSS probe and the
# icon-group loader in window_icon.rs.
windows = { version = "0.61", features = [
    "Wdk_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
